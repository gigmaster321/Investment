# ─────────────────────────────────────────────────────────────────────────────
# HTTP-only configuration — used immediately after deployment.
# Once SSL is provisioned via certbot, replace this file with nginx/ssl.conf.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt ACME challenge — required for certbot --webroot to work
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Express API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required: pass session cookies through the proxy
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 60s;
    }

    # ── WordPress-compatible admin API ────────────────────────────────────────
    location /wp-json/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ── React SPA fallback ────────────────────────────────────────────────────
    # All non-API, non-asset paths serve index.html so Wouter can handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options     "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"  always;
}
