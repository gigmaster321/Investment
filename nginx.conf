# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Quantum Investments, Hostinger KVM VPS (2 GB RAM, Ubuntu 24.04)
#
# Deploy to:  /etc/nginx/sites-available/quantum-investments
# Enable with: ln -s /etc/nginx/sites-available/quantum-investments \
#                    /etc/nginx/sites-enabled/quantum-investments
#             rm -f /etc/nginx/sites-enabled/default
#             nginx -t && systemctl reload nginx
#
# Replace ALL occurrences of YOURDOMAIN.COM with your actual domain.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Rate limiting zones (declared at http context level in sites-available) ───
# Limits API requests to 30/s per IP with a burst queue of 60.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─────────────────────────────────────────────────────────────────────────────
# HTTP server
# Phase 1: serves the app over plain HTTP.
# Phase 2: once SSL is issued, this block redirects to HTTPS and the
#          second server block (443) handles all traffic.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.COM www.YOURDOMAIN.COM;

    # Let's Encrypt ACME challenge — certbot --webroot needs this accessible
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── PHASE 1: Comment this block out after SSL is active ──────────────────
    root /var/www/quantum-investments/dist;
    index index.html;

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /wp-json/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # Cache static assets (content-hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React SPA fallback — all non-asset, non-API paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    # ── END PHASE 1 ──────────────────────────────────────────────────────────

    # ── PHASE 2: Uncomment this after SSL is active ───────────────────────────
    # location / {
    #     return 301 https://$host$request_uri;
    # }
    # ── END PHASE 2 ──────────────────────────────────────────────────────────
}

